services:
  - type: web
    name: veylo-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: lax
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # Shared with the Cloudflare Pages project of the same name so the edge can
      # vouch for the visitor's IP. Copy the generated value into the Pages
      # environment variables. Leave unset to keep the previous (coarse) behaviour.
      - key: VEYLO_EDGE_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Veylo <info@veylo.com.ng>
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: BILLING_ENABLED
        value: "false"
      - key: PAYSTACK_PRO_PLAN_CODE
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        value: https://veylo.com.ng/billing
      - key: BILLING_ENCRYPTION_KEY
        generateValue: true
      - key: ALIBABA_MODEL_STUDIO_API_KEY
        sync: false
      - key: ALIBABA_WORKSPACE_ID
        sync: false
      - key: ALIBABA_BASE_URL
        sync: false
      - key: ALIBABA_VISION_MODEL
        value: qwen3-vl-flash
      - key: ALIBABA_CREATIVE_MODEL
        value: deepseek-v4.1-flash
      - key: DELIVERY_WORKER_CONCURRENCY
        value: "4"
      - key: DELIVERY_AI_CONCURRENCY
        value: "6"
      - key: DELIVERY_VISION_BATCH_SIZE
        value: "12"
      - key: DELIVERY_CAPTION_BATCH_SIZE
        value: "8"
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DELIVERY_PIPELINE_ENABLED
        value: "true"
      # Enable new creation after the worker is healthy and the staging checks pass.
      # Existing version 3 drafts and published links remain readable during rollback.
      - key: DELIVERY_V3_ENABLED
        value: "false"
      - key: DELIVERY_WORKER_EMBEDDED
        value: "false"
      - key: ALIBABA_CAPTION_MODEL
        value: qwen3.7-flash
      - key: ALIBABA_BRIEF_MODEL
        value: qwen3.8-flash
      - key: ALIBABA_BRIEF_REVIEW_MODEL
        value: deepseek-v4.1-flash
      - key: DELIVERY_AI_START_INTERVAL_MS
        value: "100"
      - key: DELIVERY_PREPARATION_CONCURRENCY
        value: "6"

  - type: worker
    name: veylo-delivery-worker
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run delivery:worker
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DELIVERY_PIPELINE_ENABLED
        value: "true"
      - key: MONGODB_URI
        fromService: { type: web, name: veylo-api, envVarKey: MONGODB_URI }
      - key: CLIENT_URL
        fromService: { type: web, name: veylo-api, envVarKey: CLIENT_URL }
      - key: CLOUDINARY_CLOUD_NAME
        fromService: { type: web, name: veylo-api, envVarKey: CLOUDINARY_CLOUD_NAME }
      - key: CLOUDINARY_API_KEY
        fromService: { type: web, name: veylo-api, envVarKey: CLOUDINARY_API_KEY }
      - key: CLOUDINARY_API_SECRET
        fromService: { type: web, name: veylo-api, envVarKey: CLOUDINARY_API_SECRET }
      - key: ALIBABA_MODEL_STUDIO_API_KEY
        fromService: { type: web, name: veylo-api, envVarKey: ALIBABA_MODEL_STUDIO_API_KEY }
      - key: ALIBABA_WORKSPACE_ID
        fromService: { type: web, name: veylo-api, envVarKey: ALIBABA_WORKSPACE_ID }
      - key: ALIBABA_BASE_URL
        fromService: { type: web, name: veylo-api, envVarKey: ALIBABA_BASE_URL }
      - key: ALIBABA_VISION_MODEL
        fromService: { type: web, name: veylo-api, envVarKey: ALIBABA_VISION_MODEL }
      - key: ALIBABA_CREATIVE_MODEL
        fromService: { type: web, name: veylo-api, envVarKey: ALIBABA_CREATIVE_MODEL }
      - key: ALIBABA_CAPTION_MODEL
        fromService: { type: web, name: veylo-api, envVarKey: ALIBABA_CAPTION_MODEL }
      - key: DELIVERY_AI_CONCURRENCY
        fromService: { type: web, name: veylo-api, envVarKey: DELIVERY_AI_CONCURRENCY }
      - key: DELIVERY_AI_START_INTERVAL_MS
        fromService: { type: web, name: veylo-api, envVarKey: DELIVERY_AI_START_INTERVAL_MS }
      - key: DELIVERY_PREPARATION_CONCURRENCY
        fromService: { type: web, name: veylo-api, envVarKey: DELIVERY_PREPARATION_CONCURRENCY }
      - key: DEEPGRAM_API_KEY
        fromService: { type: web, name: veylo-api, envVarKey: DEEPGRAM_API_KEY }
