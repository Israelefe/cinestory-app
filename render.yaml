services:
  - type: web
    name: veylo-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci && npm run verify:syntax
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: lax
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # Shared with the Cloudflare Pages project of the same name so the edge can
      # vouch for the visitor's IP. Copy the generated value into the Pages
      # environment variables. Leave unset to keep the previous (coarse) behaviour.
      - key: VEYLO_EDGE_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Veylo <info@veylo.com.ng>
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: BILLING_ENABLED
        value: "false"
      - key: PAYSTACK_PRO_PLAN_CODE
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        value: https://veylo.com.ng/billing
      - key: BILLING_ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: ALIBABA_FALLBACK_MODEL
        value: deepseek-v4.1-flash
      - key: ALIBABA_MODEL_STUDIO_API_KEY
        sync: false
      - key: ALIBABA_WORKSPACE_ID
        sync: false
      - key: ALIBABA_BASE_URL
        sync: false
      # Existing V2 delivery jobs use this separate worker setting.
      - key: DELIVERY_WORKER_CONCURRENCY
        value: "4"
      # V3 delivery preparation can run up to 50 jobs per API worker process.
      - key: DELIVERY_V3_WORKER_CONCURRENCY
        value: "50"
      - key: DELIVERY_AI_CONCURRENCY
        value: "6"
      - key: DELIVERY_VISION_BATCH_SIZE
        value: "3"
      - key: DELIVERY_CAPTION_BATCH_SIZE
        value: "8"
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DELIVERY_PIPELINE_ENABLED
        value: "true"
