name = "veylo-video-processing"
main = "worker.js"
compatibility_date = "2026-10-11"

[vars]
VEYLO_API_ORIGIN = "https://veylo-api-ptk3.onrender.com"
CLIENT_URL = "https://veylo.com.ng"
CLOUDFLARE_AI_ACCOUNT_ID = "935f69b03acd93c47238ee5e2d244a38"
R2_BUCKET_NAME = "veylo"
VIDEO_PLAYBACK_WORKER_URL = "https://veylo-delivery-images.israelonanefe08157.workers.dev"
VIDEO_PROCESSING_MODE = "cloudflare-containers"
VIDEO_MEDIA_WORKER_ENABLED = "true"
# Match the production API: the encoder applies the same Pro access checks.
VIDEO_DELIVERY_ENABLED = "true"
VIDEO_DELIVERY_PUBLIC = "true"
VIDEO_DELIVERY_QUALIFIED = "true"
# Prepare batches in parallel within the same aggregate daily allowance.
VIDEO_MAX_CONTAINERS = "4"
VIDEO_DAILY_CONTAINER_SECONDS = "21600"
VIDEO_MAX_JOB_SECONDS = "21600"
VIDEO_AI_MODEL_READY = "false"

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[containers]]
class_name = "VideoEncoder"
image = "../../server/VideoDelivery.Dockerfile"
image_build_context = "../../server"
max_instances = 4
# Custom instances require at least 3 GiB RAM per vCPU.
instance_type = { vcpu = 2, memory_mib = 6144, disk_mb = 20000 }

[[durable_objects.bindings]]
name = "VIDEO_ENCODERS"
class_name = "VideoEncoder"

[[durable_objects.bindings]]
name = "VIDEO_COORDINATOR"
class_name = "VideoCoordinator"

[exports.VideoEncoder]
type = "durable-object"
storage = "sqlite"

[exports.VideoCoordinator]
type = "durable-object"
storage = "sqlite"
